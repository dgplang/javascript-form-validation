<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Form Validation</title>
    <link rel="stylesheet" href="/dist/style.css">
</head>
<body class="p-0 m-0 box-border">
<!--
REGISTER:
=========
fullname, email, phone, password, date of birth.
1. Validate all the data.
2. User must submit a valid email address.
3. Password must be greater than 7 characters and it should consist of lowercase, uppercase, number, symbol (optional)
4. For date of birth, the user must be above 18 years.
5. Show the user information after successful validation    
LOGIN:
=======
Hard-code the email and password.
1. Validate all data
2. Check if the credentials are correct
3. If correct, show the user a successful message.
-->
    <div class="w-3/4 mx-auto mx-5">
        <div class="py-5">
            <h1 class="text-4xl font-semibold text-zinc-600">Register</h1>
        </div>
        <div>
            <form>
                <div class="mb-4 flex items-end">
                    <div class="flex flex-col w-3/4">
                        <label for="fullname" class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="fullname" name="fullname" required
                               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex text-red-600 text-sm font-semibold w-1/4 pl-2 pb-0">Error message here</div>
                </div>

                <div class="mb-4 flex items-end">
                    <div class="flex flex-col w-3/4">
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email" required
                               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex text-red-600 text-sm font-semibold w-1/4 pl-2 pb-0">Error message here</div>
                </div>

                <div class="mb-4 flex items-end">
                    <div class="flex flex-col w-3/4">
                        <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
                        <input type="tel" id="phone" name="phone" required
                               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex text-red-600 text-sm font-semibold w-1/4 pl-2 pb-0">Error message here</div>
                </div>

                <div class="mb-4 flex items-end">
                    <div class="flex flex-col w-3/4">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" name="password" required
                               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex text-red-600 text-sm font-semibold w-1/4 pl-2 pb-0">Error message here</div>
                </div>

                <div class="mb-4 flex items-end">
                    <div class="flex flex-col w-3/4">
                        <label for="birthdate" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                        <input type="date" id="birthdate" name="birthdate" required
                               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex text-red-600 text-sm font-semibold w-1/4 pl-2 pb-0">Error message here</div>
                </div>
    
                <button type="submit"
                        class="w-3/4 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Register
                </button>
            </form>
        </div>

    </div>
    
</body>
</html>
